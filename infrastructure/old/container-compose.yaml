volumes:
  warehive_pgdata:
  mailpit_data:

include:
  - container-compose.zitadel.yaml

services:
  pgdb:
    image: docker.io/postgres:18.1
    restart: unless-stopped
    ports:
      - 5432:5432
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready
        - -d
        - warehive
        - -U
        - postgres
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 20s
    environment:
      PGUSER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - warehive_pgdata:/var/lib/postgresql:rw

  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    restart: unless-stopped
    volumes:
      - mailpit_data:/data
    ports:
      - 8025:8025
      - 1025:1025
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  swaggerui:
    image: docker.swagger.io/swaggerapi/swagger-ui
    container_name: swagger-ui
    restart: unless-stopped
    ports:
      - 5001:8080
    environment:
      URL: "http://localhost:5000/openapi/v1.json"
